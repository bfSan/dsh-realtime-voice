# One package, three official DSH roles: bundle layer, Host plugin, and Web client plugin.
- insert:
    - id: realtime-voice
      name: '@harness-remote/dsh-realtime-voice'
      # `apiProxy` is intentionally absent: DSH 0.1.5 removed that service and
      # this plugin now installs the legacy surface itself over sessionController.
      inject: [webServer, credentials, agents, systemPrompt, tools]
